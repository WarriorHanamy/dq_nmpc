[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq_nmpc"
version = "0.1.0"
description = "Dual Quaternion NMPC for Quadrotor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "casadi>=3.6",
    "scipy>=1.10",
    "osqp>=0.6",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "plotly>=5.0",
    "rerun-sdk>=0.19",
    "minco-python",
    "quadrotor-sim",
    "acados-template",
]

[tool.uv.sources]
minco-python = { path = "deps/minco-python" }
quadrotor-sim = { path = "deps/mujoco_quadrotor" }
acados-template = { path = "deps/acados/interfaces/acados_template" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
dq-run = "dq_nmpc.cli.nmpc:main_run"
dq-trajectory = "dq_nmpc.cli.trajectory:main"
dq-codegen = "dq_nmpc.cli.nmpc:main_codegen"
dq-build-sim = "dq_nmpc.cli.build:main_build_sim"
dq-nmpc-vis-ref = "dq_nmpc.cli.nmpc:main_vis_ref"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_nmpc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N802", "N803", "N806", "N817"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acados: tests requiring acados OCP solver",
]
