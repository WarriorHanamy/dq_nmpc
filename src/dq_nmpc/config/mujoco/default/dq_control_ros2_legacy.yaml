/**:
  ros__parameters:
    # dynamics
    mav_name: "quadrotor"
    platform_type: "eagle"
    gravity: 9.80665
    mass: 1.0
    # mass: 1.176   # race7, race8
    frame_dx: 0.078
    frame_dy: 0.0985
    motor_time_constant: 0.05
    min_rpm: 1080.0
    max_rpm: 24000.0
    drag_coefficient: 0.0
    kf: 2.47e-08
    km: 2.68e-10
    ixx: 0.00305587
    iyy: 0.00159695
    izz: 0.00159687

    # px4 interface
    lin_cof_a: 0.00005
    lin_int_b: -0.35
    so3_cmd_timeout: 0.25
    trpy_cmd_timeout: 0.25

    # so3_control_params
    # Reducing angular derivative
    gains:
      pos:
        x: 7.1 # 1.8
        y: 7.1 # 1.8
        z: 11.9 # 3.0
          #z: 9.0 # 3.0
      vel:
        x: 2.4 # 0.6
        y: 2.4 # 0.6
        z: 6.7 # 1.7
          #z: 5.0 # 1.7
      rot:
        x: 1.5
        y: 1.5
        z: 1.0
      ang:
        x: 0.13
        y: 0.13
        z: 0.1
      ki:
        x: 0.00 # 0.00
        y: 0.004 # 0.001
        z: 0.03 # 0.008
    

    # mav_manager_params
    need_imu: false
    need_output_data: true
    use_attitude_safety_catch: false
    max_attitude_angle: 0.43
    takeoff_height: 0.5
