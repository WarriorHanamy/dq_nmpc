#####################################
# NMPC Solver Configuration
# Standalone -- no ROS dependency

mav_name: "quadrotor"

physics:
  mass: 1.0
  gravity: 9.81
  ixx: 0.00305587
  iyy: 0.00159695
  izz: 0.00159687

ocp:
  # Q and Q_e: state-cost weights for the 12-element cost vector:
  #   [ln_err_rot_x, ln_err_rot_y, ln_err_rot_z,
  #    ln_err_trans_x, ln_err_trans_y, ln_err_trans_z,
  #    angvel_x, angvel_y, angvel_z,
  #    vel_x, vel_y, vel_z]
  # R: control-cost weights [thrust, tau_x, tau_y, tau_z]
  Q:   [200., 200., 200., 10., 10., 50., 0.1, 0.1, 0.1, 1., 1., 1.]
  Q_e: [200., 200., 200., 10., 10., 50., 0.1, 0.1, 0.1, 1., 1., 1.]
  R:   [0.1, 0.1, 0.1, 0.1]
  nx: 14
  nu: 4
  lbu: [0.2, -0.45, -0.45, -0.45]
  ubu: [42.0, 0.45, 0.45, 0.45]

  # MPC control-loop period: replan every control_update_interval seconds.
  # Independent from the OCP shooting interval Tsim.
  control_update_interval: 0.03

  # OCP prediction horizon total duration [s] (= ocp.solver_options.tf).
  # Tsim = horizon_time / horizon_steps is computed by acados internally
  # and does not need to equal control_update_interval.  This allows a
  # longer look-ahead while keeping a high control update rate.
  horizon_time: 1.5

  # Number of shooting nodes (= ocp.dims.N).
  horizon_steps: 21
